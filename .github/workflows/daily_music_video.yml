name: Free Music Video (Manual Song)

on:
  workflow_dispatch:
    inputs:
      song_title:
        description: "عنوان الأغنية"
        required: true
        type: string
        default: "أغنية مصرية جديدة"
      song_theme:
        description: "موضوع الأغنية"
        required: false
        type: string
        default: "أغنية مصرية أصلية"
      dry_run:
        description: "تشغيل تجريبي: جهّز المعاينة فقط دون نشرها على يوتيوب"
        required: false
        type: boolean
        default: false

concurrency:
  group: free-music-video
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  song:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify free song file and required secrets
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -e
          if [ ! -s "music_input/song.mp3" ]; then
            echo "::error::Missing music_input/song.mp3. Download your free ACE-Step song and upload it there first."
            exit 1
          fi
          missing=0
          for key in PEXELS_API_KEY YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub Actions secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Song file and required secrets found."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Check Python syntax
        run: python -m compileall -q scripts/create_free_music_video.py scripts/upload_youtube.py

      - name: Assemble vertical music video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SONG_TITLE: ${{ inputs.song_title }}
          SONG_THEME: ${{ inputs.song_theme }}
        run: python scripts/create_free_music_video.py

      - name: Validate music video and upload metadata
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          video = Path("final_music_video.mp4")
          content = json.loads(Path("content.json").read_text(encoding="utf-8"))
          assert video.is_file() and video.stat().st_size > 0, "Missing final music video"
          assert content.get("title", "").strip(), "Missing song title"
          assert content.get("description", "").strip(), "Missing song description"
          assert "#" in content["description"], "Missing hashtags in song description"
          assert content.get("category_id") == "10", "Music upload must use the Music category"
          assert content.get("contains_synthetic_media") is True, "AI-generated music must be disclosed to YouTube"
          assert isinstance(content.get("tags"), list) and content["tags"], "Missing song tags"
          duration = float(subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "format=duration",
               "-of", "default=noprint_wrappers=1:nokey=1", str(video)],
              check=True, capture_output=True, text=True
          ).stdout.strip())
          print("Validated music video metadata; duration {:.2f}s".format(duration))
          PY

      - name: Save video preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-music-video-preview
          path: |
            final_music_video.mp4
            content.json
          retention-days: 7

      - name: Explain dry run result
        if: ${{ inputs.dry_run == true }}
        run: echo "Dry run complete. The video and metadata are saved as an artifact; no YouTube upload was attempted."

      - name: Upload music video to YouTube
        if: ${{ inputs.dry_run != true }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_PATH: final_music_video.mp4
          PRIVACY_STATUS: public
        run: python scripts/upload_youtube.py
