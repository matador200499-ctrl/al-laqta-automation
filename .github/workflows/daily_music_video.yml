name: AI Music Video (fal)

on:
  workflow_dispatch:
    inputs:
      song_theme:
        description: "موضوع الأغنية (اتركه فارغًا لاختيار فكرة تلقائيًا)"
        required: false
        type: string
        default: ""

concurrency:
  group: ai-music-video
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  song:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -e
          missing=0
          for key in FAL_KEY GROQ_API_KEY PEXELS_API_KEY YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required GitHub Actions secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets in Settings > Secrets and variables > Actions, then run again."
            exit 1
          fi
          echo "All required secrets are present."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Generate song and video
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SONG_THEME: ${{ inputs.song_theme }}
        run: python scripts/generate_music_song.py

      - name: Save song preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-music-song-preview
          path: |
            final_music_video.mp4
            lyrics.txt
            song_info.json
            content.json
          retention-days: 7

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_PATH: final_music_video.mp4
          PRIVACY_STATUS: public
        run: python scripts/upload_youtube.py
