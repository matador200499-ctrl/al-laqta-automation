name: Daily AI Song Video

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

jobs:
  song:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install requests
      - name: Generate song and video
        env:
          ACE_STEP_API_URL: ${{ secrets.ACE_STEP_API_URL }}
          ACE_STEP_API_KEY: ${{ secrets.ACE_STEP_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/generate_music_song.py
      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_PATH: final_music_video.mp4
          PRIVACY_STATUS: public
        run: python scripts/upload_youtube.py
