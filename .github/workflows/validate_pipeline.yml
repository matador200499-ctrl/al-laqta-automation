name: Pipeline Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq Pillow arabic-reshaper python-bidi
      - name: Check Python syntax
        run: python -m compileall -q scripts pick_topic.py tests
      - name: Test metadata and Arabic subtitles
        run: python -m unittest discover -s tests -v
