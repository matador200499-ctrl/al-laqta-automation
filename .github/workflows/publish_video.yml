name: Publish Video (Automated)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-naskh-arabic
          pip install groq edge-tts moviepy requests
      - name: Test
        run: echo "Workflow fixed - ready to add scripts"
