name: Publish Video (Automated)

on:
  schedule:
    # 8 videos every day — one every 3 hours.
    # UTC: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      manual_topic:
        description: "موضوع فيديو يدوي (اتركه فارغًا لاستخدام قائمة المواضيع)"
        required: false
        type: string
      dry_run:
        description: "تشغيل تجريبي: جهّز الفيديو والمعاينة دون نشره على يوتيوب"
        required: false
        type: boolean
        default: false

# يمنع تشغيل نسختين من النشر في نفس الوقت.
concurrency:
  group: publish-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-noto-extra fonts-noto-ui-core fontconfig libraqm0
          pip install -U pip
          pip install groq edge-tts gTTS moviepy==1.0.3 requests Pillow arabic-reshaper python-bidi google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Check Python syntax
        run: python -m compileall -q scripts pick_topic.py

      - name: Prepare a manually supplied topic
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_topic != '' }}
        env:
          MANUAL_TOPIC: ${{ inputs.manual_topic }}
        run: |
          printf '%s\n' "$MANUAL_TOPIC" > manual_topic.txt
          echo "Using a manually supplied topic; the topic queue will not be consumed."

      - name: Pick next topic
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.manual_topic == '' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python pick_topic.py

      - name: Generate script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_script.py

      - name: Validate generated script and YouTube metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          script = json.loads(Path("script.json").read_text(encoding="utf-8"))
          content = json.loads(Path("content.json").read_text(encoding="utf-8"))
          assert script.get("topic"), "Missing video topic"
          assert isinstance(script.get("scenes"), list) and script["scenes"], "Missing scenes"
          assert content.get("title", "").strip(), "Missing YouTube title"
          assert content.get("description", "").strip(), "Missing YouTube description"
          assert isinstance(content.get("tags"), list) and content["tags"], "Missing YouTube tags"
          assert content.get("category_id") in {"10", "22", "23", "24", "25", "26", "27", "28"}, "Missing or invalid YouTube category"
          assert isinstance(content.get("contains_synthetic_media"), bool), "Missing synthetic-media disclosure flag"
          assert "#" in content["description"], "Missing hashtags in YouTube description"
          print("Validated {} scenes and YouTube metadata for: {}".format(len(script["scenes"]), script["topic"]))
          PY

      - name: Generate voice
        run: python scripts/generate_voice.py

      - name: Generate free background music
        run: python scripts/generate_background_music.py

      - name: Fetch clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Assemble vertical Shorts master
        run: python scripts/assemble_video.py

      - name: Verify vertical master and duration
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          video = Path("final_video.mp4")
          if not video.is_file() or video.stat().st_size == 0:
              raise SystemExit("Vertical Shorts master is missing or empty.")
          subtitles = Path("captions_ar.srt")
          if not subtitles.is_file() or subtitles.stat().st_size < 100:
              raise SystemExit("Arabic subtitles were not generated correctly.")
          result = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,width,height:format=duration",
               "-of", "json", str(video)],
              check=True, capture_output=True, text=True
          )
          info = json.loads(result.stdout)
          stream = next(s for s in info["streams"] if s.get("codec_type") == "video")
          duration = float(info["format"]["duration"])
          print("Shorts master: {}x{}, {:.2f} seconds".format(stream["width"], stream["height"], duration))
          if (stream["width"], stream["height"]) != (1080, 1920):
              raise SystemExit("Shorts master must be 1080x1920.")
          if duration <= 0 or duration > 179.8:
              raise SystemExit("Video is not safely within the 3-minute Shorts limit; refusing to upload.")
          PY

      - name: Create 16:9 regular-video version
        run: |
          ffmpeg -y -i final_video.mp4 -filter_complex "[0:v]split=2[bg][fg];[bg]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,boxblur=24:12[background];[fg]scale=608:1080:force_original_aspect_ratio=decrease[foreground];[background][foreground]overlay=(W-w)/2:(H-h)/2,setsar=1,fps=25,format=yuv420p[video]" -map "[video]" -map "0:a?" -c:v libx264 -preset veryfast -crf 21 -c:a aac -b:a 192k -movflags +faststart -shortest landscape_video.mp4
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          video = Path("landscape_video.mp4")
          if not video.is_file() or video.stat().st_size == 0:
              raise SystemExit("Landscape version was not created.")
          result = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,width,height:format=duration",
               "-of", "json", str(video)],
              check=True, capture_output=True, text=True
          )
          info = json.loads(result.stdout)
          stream = next(s for s in info["streams"] if s.get("codec_type") == "video")
          duration = float(info["format"]["duration"])
          print("Regular-video master: {}x{}, {:.2f} seconds".format(stream["width"], stream["height"], duration))
          if (stream["width"], stream["height"]) != (1920, 1080):
              raise SystemExit("Regular-video master must be 1920x1080 (16:9).")
          if duration <= 0:
              raise SystemExit("Regular-video master has invalid duration.")
          PY

      - name: Save both video versions, metadata and captions preview
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-preview
          path: |
            final_video.mp4
            landscape_video.mp4
            script.json
            content.json
            captions_ar.srt
          retention-days: 7

      - name: Explain dry run result
        if: ${{ inputs.dry_run == true }}
        run: echo "Dry run complete. Vertical Shorts and horizontal 16:9 versions, metadata and Arabic subtitles are saved in the workflow artifact; no YouTube upload was attempted."

      - name: Upload regular 16:9 video
        if: ${{ inputs.dry_run != true }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_PATH: landscape_video.mp4
          YOUTUBE_TITLE_SUFFIX: " | فيديو كامل"
          UPLOAD_RESULT_PATH: upload_result_regular.json
          PRIVACY_STATUS: public
          CAPTION_REPAIR_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python scripts/upload_youtube.py

      - name: Upload vertical YouTube Short
        if: ${{ inputs.dry_run != true }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_PATH: final_video.mp4
          UPLOAD_RESULT_PATH: upload_result_shorts.json
          PRIVACY_STATUS: public
          CAPTION_REPAIR_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python scripts/upload_youtube.py

      - name: Save topic rotation
        if: ${{ inputs.dry_run != true }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics.txt used_topics.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish regular video and Short; rotate topic"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "Topic rotation saved successfully"
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying in 15 seconds..."
              sleep 15
            done
            echo "Failed to save topic rotation after 3 attempts"
            exit 1
          fi
