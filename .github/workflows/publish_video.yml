name: Publish Video (Automated)

on:
  schedule:
    - cron: '0 */3 * * *' # كل 3 ساعات
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (ffmpeg + Arabic fonts + raqm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-naskh-arabic \
            fonts-noto-kufi-arabic \
            libraqm0 \
            libraqm-dev
          fc-cache -f
          echo "Arabic fonts ready"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pick next topic
        run: python pick_topic.py

      - name: Use manual topic
        run: |
          if [ -f "manual_topic.txt" ]; then echo "MANUAL_TOPIC=$(cat manual_topic.txt)" >> $GITHUB_ENV; fi

      - name: Generate script with Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_script.py

      - name: Generate voiceover (edge-tts)
        run: python scripts/generate_voice.py

      - name: Fetch stock video clips (Pexels)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Assemble final video
        run: python scripts/assemble_video.py

      - name: Upload video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/upload_youtube.py

      - name: Commit topic queue changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add used_topics.txt topics.txt || true
          git diff --staged --quiet || git commit -m "Update topic queue [skip ci]" && git push || true

      - name: Save run details as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-details
          path: output/
