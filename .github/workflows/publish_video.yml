name: Publish Video (Automated)

on:
  push:
    paths:
      - "scripts/generate_script.py"
  schedule:
    # 8 videos every day — one every 3 hours.
    # UTC: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-noto-extra fonts-noto-ui-core fontconfig libraqm0
          pip install -U pip
          pip install groq edge-tts moviepy==1.0.3 requests Pillow arabic-reshaper python-bidi google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Pick next topic
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python pick_topic.py

      - name: Generate script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_script.py

      - name: Validate generated files
        run: python -c 'import json; s=json.load(open("script.json", encoding="utf-8")); c=json.load(open("content.json", encoding="utf-8")); assert s.get("scenes") and c.get("title"); print("Validated {} scenes".format(len(s["scenes"])))'

      - name: Generate voice
        run: python scripts/generate_voice.py

      - name: Generate free background music
        run: python scripts/generate_background_music.py

      - name: Fetch clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Assemble video
        run: python scripts/assemble_video.py

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_PATH: final_video.mp4
          PRIVACY_STATUS: public
        run: python scripts/upload_youtube.py

      - name: Save topic rotation
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics.txt used_topics.txt
          if ! git diff --cached --quiet; then
            git commit -m "Rotate published video topic"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "Topic rotation saved successfully"
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying in 15 seconds..."
              sleep 15
            done
            echo "Failed to save topic rotation after 3 attempts"
            exit 1
          fi
