name: Publish Video (Automated)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish_video.yml'
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-noto-ui-core libraqm0
          pip install -U pip
          pip install groq edge-tts moviepy==1.0.3 requests Pillow arabic-reshaper python-bidi google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Generate script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_script.py

      - name: Validate generated files
        run: python -c 'import json; s=json.load(open("script.json", encoding="utf-8")); c=json.load(open("content.json", encoding="utf-8")); assert s.get("scenes") and c.get("title"); print("Validated {} scenes".format(len(s["scenes"])))'

      - name: Generate voice
        run: python scripts/generate_voice.py

      - name: Fetch clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Assemble video
        run: python scripts/assemble_video.py

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_PATH: final_video.mp4
          PRIVACY_STATUS: private
        run: python scripts/upload_youtube.py
