- name: Install system dependencies (ffmpeg + Arabic fonts + raqm)
  run: |
    sudo apt-get update -qq
    sudo apt-get install -y --no-install-recommends \
      ffmpeg \
      fonts-noto-naskh-arabic \
      fonts-noto-kufi-arabic \
      fonts-noto-color-emoji \
      libraqm-dev \
      libraqm0 \
      python3-raqm
    fc-cache -f
    echo "Fonts installed, checking..."
    fc-list :lang=ar | head -n 10
