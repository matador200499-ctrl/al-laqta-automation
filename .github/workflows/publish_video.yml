name: Publish Video (Automated)
on: [workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-naskh-arabic fonts-noto-kufi-arabic libraqm0
          echo "OK - fixed from 1h to 30s"
