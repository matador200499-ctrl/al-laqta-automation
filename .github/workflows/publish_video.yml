name: Publish Video (Automated)

on:
  schedule:
    # 8 videos every day — one every 3 hours.
    # UTC: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      manual_topic:
        description: "موضوع فيديو يدوي (اتركه فارغًا لاستخدام قائمة المواضيع)"
        required: false
        type: string
      dry_run:
        description: "تشغيل تجريبي: جهّز الفيديو والمعاينة دون نشره على يوتيوب"
        required: false
        type: boolean
        default: false

# يمنع تشغيل نسختين من النشر في نفس الوقت،
# وبالتالي لا يمكن لتشغيلين قراءة نفس topics.txt وإنتاج نفس الفيديو.
concurrency:
  group: publish-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-noto-extra fonts-noto-ui-core fontconfig libraqm0
          pip install -U pip
          pip install groq edge-tts gTTS moviepy==1.0.3 requests Pillow arabic-reshaper python-bidi google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Check Python syntax
        run: python -m compileall -q scripts pick_topic.py

      - name: Prepare a manually supplied topic
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_topic != '' }}
        env:
          MANUAL_TOPIC: ${{ inputs.manual_topic }}
        run: |
          printf '%s\n' "$MANUAL_TOPIC" > manual_topic.txt
          echo "Using a manually supplied topic; the topic queue will not be consumed."

      - name: Pick next topic
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.manual_topic == '' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python pick_topic.py

      - name: Generate script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_script.py

      - name: Validate generated script and YouTube metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          script = json.loads(Path("script.json").read_text(encoding="utf-8"))
          content = json.loads(Path("content.json").read_text(encoding="utf-8"))
          assert script.get("topic"), "Missing video topic"
          assert isinstance(script.get("scenes"), list) and script["scenes"], "Missing scenes"
          assert content.get("title", "").strip(), "Missing YouTube title"
          assert content.get("description", "").strip(), "Missing YouTube description"
          assert isinstance(content.get("tags"), list) and content["tags"], "Missing YouTube tags"
          assert content.get("category_id") in {"10", "22", "23", "24", "25", "26", "27", "28"}, "Missing or invalid YouTube category"
          assert isinstance(content.get("contains_synthetic_media"), bool), "Missing synthetic-media disclosure flag"
          assert "#" in content["description"], "Missing hashtags in YouTube description"
          print("Validated {} scenes and YouTube metadata for: {}".format(len(script["scenes"]), script["topic"]))
          PY

      - name: Generate voice
        run: python scripts/generate_voice.py

      - name: Generate free background music
        run: python scripts/generate_background_music.py

      - name: Fetch clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Assemble video
        run: python scripts/assemble_video.py

      - name: Verify final video is within the Shorts duration limit
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          video = Path("final_video.mp4")
          if not video.is_file() or video.stat().st_size == 0:
              raise SystemExit("Final video is missing or empty.")
          subtitles = Path("captions_ar.srt")
          if not subtitles.is_file() or subtitles.stat().st_size < 100:
              raise SystemExit("Arabic subtitles were not generated correctly.")
          result = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "format=duration",
               "-of", "default=noprint_wrappers=1:nokey=1", str(video)],
              check=True, capture_output=True, text=True
          )
          duration = float(result.stdout.strip())
          print("Final video duration: {:.2f} seconds".format(duration))
          if duration <= 0 or duration > 179.8:
              raise SystemExit("Video is not safely within the 3-minute Shorts limit; refusing to upload.")
          PY

      - name: Save video, metadata and captions preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-preview
          path: |
            final_video.mp4
            script.json
            content.json
            captions_ar.srt
          retention-days: 7

      - name: Explain dry run result
        if: ${{ inputs.dry_run == true }}
        run: echo "Dry run complete. Video, metadata and Arabic subtitles are saved in the workflow artifact; no YouTube upload was attempted."

      - name: Upload to YouTube
        if: ${{ inputs.dry_run != true }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_PATH: final_video.mp4
          PRIVACY_STATUS: public
          CAPTION_REPAIR_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python scripts/upload_youtube.py

      - name: Save topic rotation
        if: ${{ inputs.dry_run != true }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics.txt used_topics.txt
          if ! git diff --cached --quiet; then
            git commit -m "Rotate published video topic"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                echo "Topic rotation saved successfully"
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying in 15 seconds..."
              sleep 15
            done
            echo "Failed to save topic rotation after 3 attempts"
            exit 1
          fi
